[package]
name = "dear-imgui-rs-hello"
version = "0.0.0"
edition = "2024"

[dependencies]
sdl3 = { version = "0.18.3", features = ["ash"] }
anyhow = "1.0.102"
ash = { version = "0.38.0", features = ["linked"] }
clipboard = "0.5"
dear-imgui-sdl3 = { version = "0.12.0", features = ["multi-viewport"] }
dear-imgui-ash = { version = "0.12.0", features = ["multi-viewport-sdl3"] }
dear-imgui-rs = { version = "0.12.0", features = ["tracing"] }
dear-implot = { version = "0.12.0", features = ["demo"] }
env_logger = "0.11.10"
glam = "0.32.1"
glow = "0.17.0"
image = "0.25.10"
log = "0.4.29"
num-complex = "0.4.6"
rand = "0.10.0"
rng = "0.1.0"
rodio-experiments = { path = "./rodio-experiments" }
rustfft = "6.4.1"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
rayon = "1.12.0"
tracy-client = "0.18.4"

[profile.release]
opt-level = 3

[profile.dev.package."rodio-experiments"]
opt-level = 3
